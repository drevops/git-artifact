name: Test PHP

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:
    inputs:
      enable_terminal:
        type: boolean
        description: 'Enable terminal session.'
        required: false
        default: false

permissions:
  contents: read

jobs:
  test-php:
    # Keeps the normal-deps check names equal to the required status checks.
    name: test-php (${{ matrix.php-versions }}${{ matrix.deps == 'lowest' && ', lowest' || '' }})
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write # Post the coverage summary as a PR comment.

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.3', '8.4', '8.5']
        deps: ['normal', 'lowest']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ matrix.deps }}-${{ hashFiles('**/composer.lock') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: pcov
          ini-values: pcov.directory=.

      - name: Setup SSH private key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Configure Git
        run: |
          git config --global user.name "${{ secrets.DEPLOY_USER_NAME }}"
          git config --global user.email "${{ secrets.DEPLOY_USER_EMAIL }}"

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.deps }}" == "lowest" ]]; then
            composer update --prefer-lowest --prefer-stable ${{ matrix.php-versions == '8.5' && '--ignore-platform-reqs' || '' }}
          else
            composer install ${{ matrix.php-versions == '8.5' && '--ignore-platform-reqs' || '' }}
          fi

      - name: Validate composer.json
        run: |
          composer --verbose validate
          composer normalize --dry-run

      - name: Audit composer.json
        run: |
          composer audit --no-dev

      - name: Check coding standards
        if: matrix.php-versions == '8.4' && matrix.deps == 'normal'
        run: composer lint
        continue-on-error: ${{ vars.CI_LINT_IGNORE_FAILURE == '1' }}

      - name: Run tests
        run: composer test-coverage
        continue-on-error: ${{ vars.CI_TEST_IGNORE_FAILURE == '1' }}

      - name: Check code coverage threshold
        if: matrix.php-versions == '8.4' && matrix.deps == 'normal'
        run: |
          test -f .logs/cobertura.xml || { echo "Missing .logs/cobertura.xml."; exit 1; }
          RATE=$(grep -o 'line-rate="[0-9.]*"' .logs/cobertura.xml | head -1 | tr -cd '0-9.')
          [ -n "$RATE" ] || { echo "No line-rate found in .logs/cobertura.xml."; exit 1; }
          PERCENT=$(awk "BEGIN {printf \"%.2f\", $RATE*100}")
          echo "Coverage: $PERCENT% (threshold: $CI_CODE_COVERAGE_THRESHOLD%)"
          if awk "BEGIN {exit !($PERCENT < $CI_CODE_COVERAGE_THRESHOLD)}"; then
            echo "FAIL: coverage too low."
            exit 1
          fi
          { echo "COVERAGE_CONTENT<<EOF"; sed '/./,$!d' .logs/coverage.txt; echo "EOF"; } >> "$GITHUB_ENV"
        env:
          CI_CODE_COVERAGE_THRESHOLD: ${{ vars.CI_CODE_COVERAGE_THRESHOLD || '80' }}

      - name: Post coverage summary as PR comment
        if: matrix.php-versions == '8.4' && matrix.deps == 'normal' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987 # v3
        with:
          message: |
            ```
            ${{ env.COVERAGE_CONTENT }}
            ```
          # Post a new comment every time to keep the coverage history.
          hide_and_recreate: true

      - name: Upload coverage report as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{github.job}}-code-coverage-report-${{ matrix.php-versions }}-${{ matrix.deps }}
          path: .logs
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: matrix.php-versions == '8.4' && matrix.deps == 'normal' && env.CODECOV_TOKEN != ''
        with:
          files: .logs/junit.xml
          report_type: test_results
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: matrix.php-versions == '8.4' && matrix.deps == 'normal' && env.CODECOV_TOKEN != ''
        with:
          files: .logs/cobertura.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Setup upterm session
        if: ${{ !cancelled() && github.event.inputs.enable_terminal == 'true' }}
        uses: owenthereal/action-upterm@6c2d60e09009f59cb4c45c88767c78701f14d121 # v2
        timeout-minutes: 30
        with:
          limit-access-to-actor: true

  build-php:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.4

      - name: Install dependencies
        run: composer install

      - name: Build PHAR
        run: composer build

      - name: Test PHAR
        run: |
          ./.build/git-artifact --version
          ./.build/git-artifact --help || exit 1

      - name: Setup upterm session
        if: ${{ !cancelled() && github.event.inputs.enable_terminal == 'true' }}
        uses: owenthereal/action-upterm@6c2d60e09009f59cb4c45c88767c78701f14d121 # v2
        timeout-minutes: 30
        with:
          limit-access-to-actor: true

  # Demonstration of deployment in 'force-push' mode.
  deploy-force-push:
    needs:
      - test-php
      - build-php

    runs-on: ubuntu-latest

    env:
      GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Fetch all history for git repository.
          fetch-depth: 0
          # Do not persist credentials after checkout
          # to allow to use custom credentials to push to a remote repo.
          persist-credentials: false
          ref: ${{ github.head_ref }}

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-versions }}

      - name: Setup SSH private key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Configure Git
        run: |
          git config --global user.name "${{ secrets.DEPLOY_USER_NAME }}"
          git config --global user.email "${{ secrets.DEPLOY_USER_EMAIL }}"

      - name: Install dependencies
        run: composer install

      # Test file will have a consistent name between deployments, but
      # the contents will be added to on each deployment to simulate
      # changes in the source repository.
      - name: Prepare test file.
        run: |
          export TEST_FILE="test-file--force-push--gha--${GITHUB_BRANCH//\//-}.txt"
          echo "Deployment 1 for branch $GITHUB_BRANCH" > $TEST_FILE
          date "+%Y%m%d-%H%M%S" >> $TEST_FILE
          cat $TEST_FILE
          echo $TEST_FILE > $HOME/test-file.txt

      - name: Deployment 1
        run: |
          ./git-artifact \
            git@github.com:drevops/git-artifact-destination.git \
            --branch=mode--force-push--gha--[branch] \
            --mode=force-push \
            --log=$HOME/report--mode--force-push.txt \
            -vvv

          DEPLOYED_BRANCH=$(sed -n 's/Remote branch://p' $HOME/report--mode--force-push.txt | sed 's/ //g')
          echo "Deployed to $DEPLOYED_BRANCH"
          echo
          echo "See https://github.com/drevops/git-artifact-destination/blob/$DEPLOYED_BRANCH/$(cat $HOME/test-file.txt)"
          rm $HOME/report--mode--force-push.txt

      - name: Update the test file to simulate changes in the source repository.
        run: |
          export TEST_FILE="test-file--force-push--gha--${GITHUB_BRANCH//\//-}.txt"
          echo "Deployment 2 for branch $GITHUB_BRANCH" > $TEST_FILE
          date "+%Y%m%d-%H%M%S" >> $TEST_FILE
          cat $TEST_FILE

      - name: Deployment 2
        run: |
          ./git-artifact \
            git@github.com:drevops/git-artifact-destination.git \
            --branch=mode--force-push--gha--[branch] \
            --mode=force-push \
            --log=$HOME/report--mode--force-push.txt \
            -vvv

          DEPLOYED_BRANCH=$(sed -n 's/Remote branch://p' $HOME/report--mode--force-push.txt | sed 's/ //g')
          echo "Deployed to $DEPLOYED_BRANCH"
          echo
          echo "See https://github.com/drevops/git-artifact-destination/blob/$DEPLOYED_BRANCH/$(cat $HOME/test-file.txt)"

  # Demonstration of deployment in 'branch' mode.
  # Note that by design, pushing into the same branch will result in the failure
  # of the second push. This is because the mode is intended to create a new
  # branch per artifact deployment.
  deploy-branch:
    needs:
      - test-php
      - build-php

    runs-on: ubuntu-latest

    env:
      GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Fetch all history for git repository.
          fetch-depth: 0
          # Do not persist credentials after checkout
          # to allow to use custom credentials to push to a remote repo.
          persist-credentials: false
          ref: ${{ github.head_ref }}

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-versions }}

      - name: Setup SSH private key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Configure Git
        run: |
          git config --global user.name "${{ secrets.DEPLOY_USER_NAME }}"
          git config --global user.email "${{ secrets.DEPLOY_USER_EMAIL }}"

      - name: Install dependencies
        run: composer install

      # Test file will have a consistent name between deployments, but
      # the contents will be added to on each deployment to simulate
      # changes in the source repository.
      # Since each deployment in this mode creates a new branch, the test file
      # will be pushed to a new branch each time and won't be updated in
      # existing branches.

      - name: Prepare test file.
        run: |
          export TEST_FILE="test-file--branch--gha--${GITHUB_BRANCH//\//-}.txt"
          echo "Deployment 1 for branch $GITHUB_BRANCH" > $TEST_FILE
          date "+%Y%m%d-%H%M%S" >> $TEST_FILE
          cat $TEST_FILE
          echo $TEST_FILE > $HOME/test-file.txt
          echo "DEPLOY_MINUTE=$(date +%Y-%m-%d_%H-%M)" >> "$GITHUB_ENV"

      - name: Deployment 1
        run: |
          ./git-artifact \
            git@github.com:drevops/git-artifact-destination.git \
            --branch=mode--branch--gha--[branch]--$DEPLOY_MINUTE \
            --mode=branch \
            --log=$HOME/report--mode--branch.txt \
            -vvv

          DEPLOYED_BRANCH=$(sed -n 's/Remote branch://p' $HOME/report--mode--branch.txt | sed 's/ //g')
          echo "Deployed to $DEPLOYED_BRANCH"
          echo
          echo "See https://github.com/drevops/git-artifact-destination/blob/$DEPLOYED_BRANCH/$(cat $HOME/test-file.txt)"
          rm $HOME/report--mode--branch.txt

      - name: Update the test file to simulate changes in the source repository.
        run: |
          export TEST_FILE="test-file--branch--gha--${GITHUB_BRANCH//\//-}.txt"
          echo "Deployment 2 for branch $GITHUB_BRANCH" > $TEST_FILE
          date "+%Y%m%d-%H%M%S" >> $TEST_FILE
          cat $TEST_FILE

      - name: Deployment 2 - same branch
        run: |
          ./git-artifact \
            git@github.com:drevops/git-artifact-destination.git \
            --branch=mode--branch--gha--[branch]--$DEPLOY_MINUTE \
            --mode=branch \
            --log=$HOME/report--mode--branch.txt \
            -vvv \
            && { echo "Expected to fail as repeated pushes to the same branch are not allowed, but succeeded" >&2; exit 1; } || echo "Failed as expected"

      - name: Deployment 2 - new branch
        run: |
          ./git-artifact \
            git@github.com:drevops/git-artifact-destination.git \
            --branch=mode--branch--gha--[branch]--[timestamp:Y-m-d_H-i-s] \
            --mode=branch \
            --log=$HOME/report--mode--branch.txt \
            -vvv

          DEPLOYED_BRANCH=$(sed -n 's/Remote branch://p' $HOME/report--mode--branch.txt | sed 's/ //g')
          echo "Deployed to $DEPLOYED_BRANCH"
          echo
          echo "See https://github.com/drevops/git-artifact-destination/blob/$DEPLOYED_BRANCH/$(cat $HOME/test-file.txt)"
